<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    .card { background-color: #fff; border-radius: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); transition: transform 0.2s ease; }
    .card:hover { transform: translateY(-3px); }
    #searchResults div:hover { background-color: #e0e7ff; cursor: pointer; }
    @media print {
      body { background: #fff; }
      body * { visibility: hidden; }
      #billSection, #billSection * { visibility: visible; }
      #billSection { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      #controls, #productList, #headerControls { display: none !important; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

  <div class="container mx-auto p-6 space-y-8">
    <div class="card p-8">
      <div class="flex justify-between items-center mb-8" id="headerControls">
        <h1 class="text-4xl font-bold text-indigo-700">BillSync</h1>
        <button onclick="window.location.href='add_product.html'" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold">
          ➕ Add Product
        </button>
      </div>

      <!-- PRODUCT SEARCH -->
      <div id="productList" class="mb-6">
        <input type="text" id="searchInput" placeholder="Search products by name or ID..." class="border p-2 w-full mb-2 rounded" />
        <div id="searchResults" class="border rounded p-2 max-h-48 overflow-y-auto"></div>
      </div>

      <!-- INPUT SECTION -->
      <div id="controls" class="space-y-4 mb-10">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="quantityInput" class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
            <input type="number" id="quantityInput" placeholder="1" required class="border border-gray-300 rounded-lg p-2 w-full focus:ring focus:ring-indigo-200">
          </div>
        </div>
        <button id="addBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold">Add to Bill</button>
      </div>

      <!-- BILL SECTION -->
      <div id="billSection">
        <h2 class="text-xl font-semibold mb-3 text-gray-700">Bill Summary</h2>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200 rounded-xl overflow-hidden">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase">Product</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase">Qty</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase">GST</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase">Total (₹)</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase">Action</th>
              </tr>
            </thead>
            <tbody id="billingTableBody" class="bg-white divide-y divide-gray-200"></tbody>
          </table>
        </div>

        <div class="text-right mt-6">
          <h2 class="text-2xl font-bold">Grand Total: ₹ <span id="grandTotal">0.00</span></h2>
        </div>

        <div class="mt-6 flex justify-end space-x-4">
          <button onclick="printBill()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-semibold">🖨️ Print Bill</button>
          <button onclick="clearBill()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-semibold">🗑️ Clear Bill</button>
        </div>
      </div>
    </div>
  </div>

<script>
let products = [];
let billItems = [];
let grandTotal = 0;
let selectedProduct = null;

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const billingTableBody = document.getElementById('billingTableBody');
const grandTotalEl = document.getElementById('grandTotal');
const quantityInput = document.getElementById('quantityInput');
const addBtn = document.getElementById('addBtn');

// --- FETCH PRODUCTS ---
fetch('/products')
  .then(res => res.json())
  .then(data => { products = data; })
  .catch(err => { console.error(err); alert("❌ Error fetching product list."); });

// --- LOCAL STORAGE MANAGEMENT ---
function saveBillToLocal() {
  localStorage.setItem("billItems", JSON.stringify(billItems));
  localStorage.setItem("grandTotal", grandTotal.toFixed(2));
}

function loadBillFromLocal() {
  const savedItems = JSON.parse(localStorage.getItem("billItems") || "[]");
  const savedTotal = parseFloat(localStorage.getItem("grandTotal") || "0");
  billItems = savedItems;
  grandTotal = savedTotal;
  grandTotalEl.textContent = grandTotal.toFixed(2);
  billingTableBody.innerHTML = '';
  billItems.forEach(item => renderRow(item));
}

// --- RENDER SEARCH RESULTS ---
function renderResults(list) {
  searchResults.innerHTML = '';
  list.forEach(p => {
    const div = document.createElement('div');
    div.textContent = `${p.id} - ${p.name} (₹${p.price}, Stock: ${p.stock})`;
    div.className = 'p-2 hover:bg-gray-200 cursor-pointer';
    div.addEventListener('click', () => {
      selectedProduct = p;
      searchInput.value = `${p.id} - ${p.name}`;
      searchResults.innerHTML = '';
    });
    searchResults.appendChild(div);
  });
}

// --- LIVE SEARCH ---
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.id.toString().includes(query));
  renderResults(filtered);
});

// --- BACKEND STOCK UPDATE ---
function updateBackendStock(p) {
  fetch('/updateStock', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: `id=${p.id}&stock=${p.stock}`
  });
}

// --- ADD ITEM TO BILL ---
addBtn.addEventListener('click', () => {
  const qty = parseInt(quantityInput.value);
  if (!selectedProduct || !qty || qty <= 0) return alert("⚠ Invalid selection");
  if (qty > selectedProduct.stock) return alert(`⚠ Only ${selectedProduct.stock} in stock`);

  const baseTotal = selectedProduct.price * qty;
  const gstAmount = baseTotal * (selectedProduct.gst / 100);
  const total = baseTotal + gstAmount;

  const item = { ...selectedProduct, qty, total };
  billItems.push(item);
  renderRow(item);

  grandTotal += total;
  grandTotalEl.textContent = grandTotal.toFixed(2);
  selectedProduct.stock -= qty;
  updateBackendStock(selectedProduct);

  // Save
  saveBillToLocal();

  // Reset input
  selectedProduct = null;
  searchInput.value = '';
  quantityInput.value = '';
});

// --- RENDER BILL ROW ---
function renderRow(item) {
  const row = document.createElement('tr');
  row.innerHTML = `
    <td class="px-6 py-4">${item.id}</td>
    <td class="px-6 py-4">${item.name}</td>
    <td class="px-6 py-4">${item.qty}</td>
    <td class="px-6 py-4">${item.gst}%</td>
    <td class="px-6 py-4">₹${item.total.toFixed(2)}</td>
    <td class="px-6 py-4">
      <div class="flex space-x-2">
        <button class="bg-yellow-500 hover:bg-yellow-600 text-white px-2 py-1 rounded editBtn">Edit</button>
        <button class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded deleteBtn">Delete</button>
      </div>
    </td>
  `;
  billingTableBody.appendChild(row);

  // --- DELETE ITEM ---
  row.querySelector('.deleteBtn').addEventListener('click', () => {
    billItems = billItems.filter(b => !(b.id === item.id && b.qty === item.qty));
    grandTotal -= item.total;
    grandTotalEl.textContent = grandTotal.toFixed(2);
    item.stock += item.qty;
    updateBackendStock(item);
    row.remove();
    saveBillToLocal();
  });

  // --- EDIT ITEM ---
  row.querySelector('.editBtn').addEventListener('click', () => {
    item.stock += item.qty;
    updateBackendStock(item);
    billItems = billItems.filter(b => !(b.id === item.id && b.qty === item.qty));
    grandTotal -= item.total;
    grandTotalEl.textContent = grandTotal.toFixed(2);
    row.remove();
    selectedProduct = item;
    searchInput.value = `${item.id} - ${item.name}`;
    quantityInput.value = item.qty;
    saveBillToLocal();
  });
}

// --- CLEAR BILL ---
function clearBill() {
  if (!confirm("⚠ Clear the entire bill?")) return;
  billItems.forEach(item => { item.stock += item.qty; updateBackendStock(item); });
  billItems = [];
  grandTotal = 0;
  grandTotalEl.textContent = "0.00";
  billingTableBody.innerHTML = '';
  localStorage.removeItem("billItems");
  localStorage.removeItem("grandTotal");
}

// --- PRINT BILL ---
function printBill() { window.print(); }

// --- RESTORE BILL ON LOAD ---
window.addEventListener('load', loadBillFromLocal);
</script>
</body>
</html>
